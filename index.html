<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OmniVault - Explorer & Excel Matrix</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #121927;
      --folder-card: #0c121e;
      --border: #202d42;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #a855f7;
      --folder-color: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.25rem; color: var(--primary); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    p { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }

    label { font-size: 0.75rem; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; }
    input, textarea {
      width: 100%;
      padding: 9px 12px;
      background: #060910;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--primary);
      color: #04101e;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); }
    button.secondary:hover { background: #334155; }
    button.danger { background: var(--danger); color: #fff; }
    button.accent { background: var(--accent); color: #fff; }
    button.folder { background: #1e293b; color: var(--folder-color); border: 1px solid #334155; }
    button.sm { padding: 4px 8px; font-size: 0.75rem; }

    /* LEVEL 1: PERSON / DIRECTORY */
    .person-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .person-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .person-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    /* LEVEL 2: CATEGORY / FOLDER ACCORDION */
    .folder-box {
      background: var(--folder-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .folder-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--folder-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .folder-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* LEVEL 3: EXCEL ITEM CARD & DYNAMIC CELLS */
    .item-card {
      background: #080c14;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .item-name { font-size: 0.95rem; font-weight: 700; color: var(--primary); }

    .fields-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 6px;
    }
    .cell-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 6px 8px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .cell-label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
    .cell-val-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .cell-action { color: var(--primary); cursor: pointer; font-size: 0.75rem; margin-left: 6px; }
    .cell-action:hover { text-decoration: underline; }

    /* DYNAMIC FIELDS CREATION IN MODAL */
    .field-pair {
      display: grid;
      grid-template-columns: 1fr 1.3fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .field-pair input { margin-bottom: 0; }

    .status-badge { font-size: 0.75rem; color: var(--success); font-weight: 700; }
    .hidden { display: none !important; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPc7uJ3vhGJonnLmtySIgbcEdPCmuZcXg",
      authDomain: "credentials-vault-d867d.firebaseapp.com",
      projectId: "credentials-vault-d867d",
      storageBucket: "credentials-vault-d867d.firebasestorage.app",
      messagingSenderId: "91849339799",
      appId: "1:91849339799:web:fd75a7cc39930b6108cad2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let cloudRawPayload = null;
    let masterCryptoKey = null;
    let vaultData = []; 

    let curPIdx = null;
    let curFIdx = null;
    let curIIdx = null;

    // --- CRYPTO (AES-GCM-256 + PBKDF2) ---
    async function deriveKey(passphrase, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(dataObj, key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(dataObj)));
      return { iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) };
    }

    async function decryptPayload(cipherArray, ivArray, key) {
      const iv = new Uint8Array(ivArray);
      const cipher = new Uint8Array(cipherArray);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    // --- AUTH OBSERVER ---
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("viewAuth").classList.add("hidden");
        document.getElementById("viewMasterKey").classList.remove("hidden");
        listenToFirestore(user.uid);
      } else {
        document.getElementById("viewAuth").classList.remove("hidden");
        document.getElementById("viewMasterKey").classList.add("hidden");
        document.getElementById("viewVault").classList.add("hidden");
      }
    });

    function listenToFirestore(uid) {
      const docRef = doc(db, "vaults", uid);
      onSnapshot(docRef, async (snap) => {
        if (snap.exists()) {
          cloudRawPayload = snap.data();
          if (masterCryptoKey) {
            try {
              vaultData = await decryptPayload(cloudRawPayload.cipher, cloudRawPayload.iv, masterCryptoKey);
              renderVault();
            } catch(e) {
              console.error("Auto-sync decrypt failed", e);
            }
          }
        } else {
          cloudRawPayload = null;
          if (masterCryptoKey) {
            vaultData = [];
            renderVault();
          }
        }
      });
    }

    window.handleLogin = async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) { alert("Login Error: " + err.message); }
    };

    window.unlockVault = async () => {
      const masterPass = document.getElementById("masterPassInput").value.trim();
      if (!masterPass) return alert("Master Passphrase daalein!");

      try {
        let salt;
        if (cloudRawPayload && Array.isArray(cloudRawPayload.salt) && cloudRawPayload.salt.length === 16) {
          salt = new Uint8Array(cloudRawPayload.salt);
        } else {
          salt = crypto.getRandomValues(new Uint8Array(16));
        }

        const derived = await deriveKey(masterPass, salt);

        if (cloudRawPayload && cloudRawPayload.cipher) {
          try {
            vaultData = await decryptPayload(cloudRawPayload.cipher, cloudRawPayload.iv, derived);
          } catch(err) {
            alert("Galat Master Key! Decryption fail ho gaya.");
            return;
          }
        } else {
          vaultData = [];
        }

        masterCryptoKey = derived;
        document.getElementById("viewMasterKey").classList.add("hidden");
        document.getElementById("viewVault").classList.remove("hidden");
        document.getElementById("masterPassInput").value = "";
        renderVault();
      } catch (e) {
        alert("Unlock Error: " + e.message);
      }
    };

    // LEVEL 1: PERSON OPERATIONS
    window.addPersonPrompt = async () => {
      const name = prompt("Person / Entity Name (e.g. SHUBHAM AGRAWAL, PRACHI AGRAWAL):");
      if (!name || !name.trim()) return;
      vaultData.push({
        id: Date.now(),
        name: name.trim(),
        folders: []
      });
      await syncCloud();
      renderVault();
    };

    window.deletePerson = async (pIdx) => {
      if (confirm(`Delete "${vaultData[pIdx].name}" and all categories inside?`)) {
        vaultData.splice(pIdx, 1);
        await syncCloud();
        renderVault();
      }
    };

    // LEVEL 2: FOLDER OPERATIONS
    window.addFolderPrompt = async (pIdx) => {
      const fName = prompt(`Folder Category for ${vaultData[pIdx].name} (e.g. SAVING ACCOUNTS, ALL CARDS, INSURANCE):`);
      if (!fName || !fName.trim()) return;
      vaultData[pIdx].folders.push({
        id: Date.now(),
        name: fName.trim().toUpperCase(),
        items: []
      });
      await syncCloud();
      renderVault();
    };

    window.deleteFolder = async (pIdx, fIdx) => {
      if (confirm(`Delete folder "${vaultData[pIdx].folders[fIdx].name}"?`)) {
        vaultData[pIdx].folders.splice(fIdx, 1);
        await syncCloud();
        renderVault();
      }
    };

    // LEVEL 3: DYNAMIC EXCEL ITEM OPERATIONS
    window.openAddItemModal = (pIdx, fIdx) => {
      curPIdx = pIdx;
      curFIdx = fIdx;
      curIIdx = null;

      document.getElementById("itemModalTitle").textContent = `Add in ${vaultData[pIdx].folders[fIdx].name}`;
      document.getElementById("itemTitleInput").value = "";
      document.getElementById("itemNotesInput").value = "";
      document.getElementById("dynamicFieldsBox").innerHTML = "";

      window.addDynamicFieldRow("Account / Card No", "");
      window.addDynamicFieldRow("PIN / Password", "", true);

      document.getElementById("itemModal").classList.remove("hidden");
      document.getElementById("itemModal").scrollIntoView({ behavior: 'smooth' });
    };

    window.editItem = (pIdx, fIdx, iIdx) => {
      curPIdx = pIdx;
      curFIdx = fIdx;
      curIIdx = iIdx;

      const item = vaultData[pIdx].folders[fIdx].items[iIdx];
      document.getElementById("itemModalTitle").textContent = `Edit in ${vaultData[pIdx].folders[fIdx].name}`;
      document.getElementById("itemTitleInput").value = item.title || "";
      document.getElementById("itemNotesInput").value = item.notes || "";

      const box = document.getElementById("dynamicFieldsBox");
      box.innerHTML = "";
      (item.fields || []).forEach(f => {
        window.addDynamicFieldRow(f.key, f.val, f.isSecret);
      });

      document.getElementById("itemModal").classList.remove("hidden");
      document.getElementById("itemModal").scrollIntoView({ behavior: 'smooth' });
    };

    window.deleteItem = async (pIdx, fIdx, iIdx) => {
      if (confirm("Delete this entry?")) {
        vaultData[pIdx].folders[fIdx].items.splice(iIdx, 1);
        await syncCloud();
        renderVault();
      }
    };

    window.closeItemModal = () => {
      document.getElementById("itemModal").classList.add("hidden");
    };

    window.addDynamicFieldRow = (k = "", v = "", isSecret = false) => {
      const container = document.getElementById("dynamicFieldsBox");
      const row = document.createElement("div");
      row.className = "field-pair";
      row.innerHTML = `
        <input type="text" placeholder="Cell Column (e.g. CVV, Nominee, IFSC, Policy)" value="${escapeQuotes(k)}" class="f-key" />
        <input type="${isSecret ? 'password' : 'text'}" placeholder="Value" value="${escapeQuotes(v)}" class="f-val" />
        <button type="button" class="danger sm" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    };

    window.saveItem = async () => {
      const title = document.getElementById("itemTitleInput").value.trim();
      const notes = document.getElementById("itemNotesInput").value.trim();

      if (!title) return alert("Title daalna zaroori hai (e.g. SBI Saving, HDFC Regalia, LIC)!");

      const fieldPairs = [];
      const keys = document.querySelectorAll(".f-key");
      const vals = document.querySelectorAll(".f-val");

      for (let i = 0; i < keys.length; i++) {
        const k = keys[i].value.trim();
        const v = vals[i].value.trim();
        if (k || v) {
          fieldPairs.push({
            key: k || "Detail",
            val: v,
            isSecret: vals[i].type === "password"
          });
        }
      }

      const itemObj = {
        id: curIIdx !== null ? vaultData[curPIdx].folders[curFIdx].items[curIIdx].id : Date.now(),
        title,
        notes,
        fields: fieldPairs
      };

      if (curIIdx !== null) {
        vaultData[curPIdx].folders[curFIdx].items[curIIdx] = itemObj;
      } else {
        vaultData[curPIdx].folders[curFIdx].items.unshift(itemObj);
      }

      await syncCloud();
      window.closeItemModal();
      renderVault();
    };

    async function syncCloud() {
      if (!currentUser || !masterCryptoKey) return;
      const encrypted = await encryptPayload(vaultData, masterCryptoKey);

      let saltArr = (cloudRawPayload && cloudRawPayload.salt) 
        ? cloudRawPayload.salt 
        : Array.from(crypto.getRandomValues(new Uint8Array(16)));

      await setDoc(doc(db, "vaults", currentUser.uid), {
        iv: encrypted.iv,
        cipher: encrypted.cipher,
        salt: saltArr,
        lastModified: new Date().toISOString()
      });
    }

    // --- RENDER & UNIVERSAL INSTANT SEARCH ---
    window.renderVault = () => {
      const container = document.getElementById("vaultList");
      const query = (document.getElementById("searchQuery").value || "").trim().toLowerCase();
      container.innerHTML = "";

      if (vaultData.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted);">Vault empty hai. Upar "+ Add Person" dabayein (e.g. SHUBHAM AGRAWAL).</div>`;
        return;
      }

      let hasMatch = false;

      vaultData.forEach((person, pIdx) => {
        const matchPerson = person.name.toLowerCase().includes(query);

        // Filter folders
        let foldersHtml = "";
        (person.folders || []).forEach((folder, fIdx) => {
          const matchFolder = folder.name.toLowerCase().includes(query);

          const matchingItems = (folder.items || []).filter(item => {
            if (!query || matchPerson || matchFolder) return true;
            if (item.title.toLowerCase().includes(query)) return true;
            if (item.notes && item.notes.toLowerCase().includes(query)) return true;
            return (item.fields || []).some(f => 
              f.key.toLowerCase().includes(query) || f.val.toLowerCase().includes(query)
            );
          });

          if (query && !matchPerson && !matchFolder && matchingItems.length === 0) {
            return;
          }

          let itemsHtml = "";
          matchingItems.forEach((item) => {
            const realIIdx = folder.items.findIndex(i => i.id === item.id);

            let cellsHtml = "";
            (item.fields || []).forEach((f, cIdx) => {
              const cid = `c_${item.id}_${cIdx}`;
              const isHidden = f.isSecret;
              cellsHtml += `
                <div class="cell-box">
                  <div class="cell-label">${escapeHtml(f.key)}</div>
                  <div class="cell-val-row">
                    <span id="${cid}" style="font-family: ${isHidden ? 'monospace' : 'inherit'}; font-weight: 500;">
                      ${isHidden ? '••••••••' : escapeHtml(f.val)}
                    </span>
                    <div>
                      ${isHidden ? `<span class="cell-action" onclick="toggleMask('${cid}', '${escapeQuotes(f.val)}')">Show</span>` : ''}
                      <span class="cell-action" onclick="copyValue('${escapeQuotes(f.val)}')">Copy</span>
                    </div>
                  </div>
                </div>
              `;
            });

            itemsHtml += `
              <div class="item-card">
                <div class="item-top">
                  <span class="item-name">${escapeHtml(item.title)}</span>
                  <div class="btn-row">
                    <button class="secondary sm" onclick="editItem(${pIdx}, ${fIdx}, ${realIIdx})">Edit</button>
                    <button class="danger sm" onclick="deleteItem(${pIdx}, ${fIdx}, ${realIIdx})">Delete</button>
                  </div>
                </div>
                <div class="fields-grid">${cellsHtml}</div>
                ${item.notes ? `<div style="font-size:0.78rem; color:var(--muted); margin-top:8px; border-top:1px dashed var(--border); padding-top:4px;"><strong>Note:</strong> ${escapeHtml(item.notes)}</div>` : ''}
              </div>
            `;
          });

          foldersHtml += `
            <div class="folder-box">
              <div class="folder-header">
                <span class="folder-name">📁 ${escapeHtml(folder.name)}</span>
                <div class="btn-row">
                  <button class="sm secondary" onclick="openAddItemModal(${pIdx}, ${fIdx})">+ Add Record</button>
                  <button class="sm danger" onclick="deleteFolder(${pIdx}, ${fIdx})">Delete Folder</button>
                </div>
              </div>
              <div class="folder-content">
                ${itemsHtml || '<div style="color:var(--muted); font-size:0.8rem;">Khali folder hai. "+ Add Record" par click karein.</div>'}
              </div>
            </div>
          `;
        });

        if (query && !matchPerson && foldersHtml === "") {
          return;
        }

        hasMatch = true;
        const pDiv = document.createElement("div");
        pDiv.className = "person-card";
        pDiv.innerHTML = `
          <div class="person-header">
            <span class="person-title">👤 ${escapeHtml(person.name)}</span>
            <div class="btn-row">
              <button class="sm folder" onclick="addFolderPrompt(${pIdx})">+ Add Folder Category</button>
              <button class="sm danger" onclick="deletePerson(${pIdx})">Delete Person</button>
            </div>
          </div>
          <div>${foldersHtml || '<div style="color:var(--muted); font-size:0.85rem; padding:6px 0;">Koi category/folder nahi hai. "+ Add Folder Category" dabayein.</div>'}</div>
        `;
        container.appendChild(pDiv);
      });

      if (!hasMatch) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted);">Koi record nahi mila query ke hisaab se.</div>`;
      }
    };

    window.toggleMask = (id, val) => {
      const el = document.getElementById(id);
      el.textContent = (el.textContent === '••••••••') ? val : '••••••••';
    };

    window.copyValue = (v) => {
      if (!v) return;
      navigator.clipboard.writeText(v).then(() => alert("Copied: " + v));
    };

    window.lockVault = () => {
      masterCryptoKey = null;
      vaultData = [];
      document.getElementById("viewVault").classList.add("hidden");
      document.getElementById("viewMasterKey").classList.remove("hidden");
    };

    window.handleLogout = async () => {
      masterCryptoKey = null;
      vaultData = [];
      await signOut(auth);
    };

    function escapeHtml(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function escapeQuotes(s) { return (s || "").replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  </script>
</head>
<body>

<div class="container">

  <!-- AUTH -->
  <div id="viewAuth" class="card" style="max-width:480px; margin: 40px auto;">
    <h1>🛡️ OmniVault Access</h1>
    <p>Apne authorized email se sign-in karein.</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="your-email@gmail.com" />
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••" />
    <button onclick="handleLogin()">Sign In</button>
  </div>

  <!-- MASTER KEY -->
  <div id="viewMasterKey" class="card hidden" style="max-width:480px; margin: 40px auto;">
    <h1>🔐 Master Passphrase</h1>
    <p>Apna Master Key daalein jo aapke files ko decrypt karega.</p>
    <label>Master Passphrase</label>
    <input type="password" id="masterPassInput" placeholder="Master Key..." />
    <div class="btn-row">
      <button onclick="unlockVault()">Decrypt & Sync</button>
      <button class="secondary" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>

  <!-- VAULT MAIN -->
  <div id="viewVault" class="hidden">
    
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <span class="status-badge">● EXPLORER MATRIX E2EE ACTIVE</span>
      </div>
      <div class="btn-row">
        <button onclick="addPersonPrompt()">+ Add Person / Entity</button>
        <button class="sm secondary" onclick="lockVault()">Lock</button>
        <button class="sm danger" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="card" style="padding:10px 14px;">
      <input type="text" id="searchQuery" placeholder="🔍 Search person, folder, bank, card, policy, CVV, pin, note..." oninput="renderVault()" style="margin-bottom:0;" />
    </div>

    <!-- DYNAMIC RECORD MODAL -->
    <div id="itemModal" class="card hidden" style="border: 1px solid var(--primary);">
      <h2 id="itemModalTitle">Add Record Details</h2>
      
      <label>1. Record / Bank / Service Title (e.g. HDFC Regalia CC, SBI Saving, LIC Jeevan Labh)</label>
      <input type="text" id="itemTitleInput" placeholder="Record Title..." />

      <label>2. Dynamic Excel Cells (Add Any Label & Value)</label>
      <div id="dynamicFieldsBox"></div>
      
      <div class="btn-row" style="margin-bottom:14px;">
        <button type="button" class="secondary sm" onclick="addDynamicFieldRow('', '')">+ Add Plain Cell</button>
        <button type="button" class="secondary sm" onclick="addDynamicFieldRow('', '', true)">+ Add Secret/Masked Cell</button>
      </div>

      <label>Notes / Extra Info</label>
      <textarea id="itemNotesInput" rows="2" placeholder="Renewal dates, Nominee, Phone numbers..."></textarea>

      <div class="btn-row">
        <button onclick="saveItem()">Save to Vault</button>
        <button class="secondary" onclick="closeItemModal()">Cancel</button>
      </div>
    </div>

    <!-- EXPLORER LIST -->
    <div id="vaultList"></div>

  </div>

</div>

</body>
</html>
