<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OmniVault - Excel Dynamic Matrix</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #141d2e;
      --cell-bg: #090e17;
      --border: #233148;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; }
    .container { width: 100%; max-width: 1200px; margin: 0 auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.25rem; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    p { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; }

    label { font-size: 0.75rem; font-weight: bold; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; }
    input {
      width: 100%;
      padding: 8px 12px;
      background: var(--cell-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    input:focus { outline: none; border-color: var(--primary); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button {
      background: var(--primary);
      color: #04101e;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); }
    button.danger { background: var(--danger); color: #fff; }
    button.sm { padding: 4px 8px; font-size: 0.75rem; }

    /* EXCEL MATRIX SHEET STYLES */
    .sheet-wrapper {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 10px;
    }

    table.excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 800px;
    }

    table.excel-table th, table.excel-table td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      vertical-align: middle;
    }

    table.excel-table th {
      background: #0f172a;
      color: var(--primary);
      font-weight: 700;
      text-align: left;
      position: sticky;
      top: 0;
      white-space: nowrap;
    }

    /* Editable cell look */
    .cell-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      padding: 4px;
      margin-bottom: 0;
      border-radius: 4px;
    }
    .cell-input:focus {
      background: #020712;
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .cell-masked {
      font-family: monospace;
      letter-spacing: 2px;
    }

    .status-badge { font-size: 0.75rem; color: var(--success); font-weight: bold; }
    .hidden { display: none !important; }
    
    .quick-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      color: var(--muted);
      cursor: pointer;
    }
    .quick-tag:hover { color: var(--primary); }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPc7uJ3vhGJonnLmtySIgbcEdPCmuZcXg",
      authDomain: "credentials-vault-d867d.firebaseapp.com",
      projectId: "credentials-vault-d867d",
      storageBucket: "credentials-vault-d867d.firebasestorage.app",
      messagingSenderId: "91849339799",
      appId: "1:91849339799:web:fd75a7cc39930b6108cad2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let cloudPayload = null;
    let masterKey = null;

    // Excel Grid Data Structure
    let vaultColumns = ["Item / Purpose", "Identifier / User", "Secret / Password", "Extra Info / Notes"];
    let vaultRows = [];

    // Cryptography (PBKDF2 + AES-GCM 256)
    async function deriveKey(pass, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(pass), { name: "PBKDF2" }, false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(data, key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(data)));
      return { iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) };
    }

    async function decryptData(cipherArr, ivArr, key) {
      const iv = new Uint8Array(ivArr);
      const cipher = new Uint8Array(cipherArr);
      const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
      return JSON.parse(new TextDecoder().decode(dec));
    }

    // Auth Observer
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("authBox").classList.add("hidden");
        document.getElementById("masterBox").classList.remove("hidden");
        listenCloud(user.uid);
      } else {
        document.getElementById("authBox").classList.remove("hidden");
        document.getElementById("masterBox").classList.add("hidden");
        document.getElementById("gridBox").classList.add("hidden");
      }
    });

    function listenCloud(uid) {
      const ref = doc(db, "vaults", uid);
      onSnapshot(ref, async (snap) => {
        if (snap.exists()) {
          cloudPayload = snap.data();
          if (masterKey) {
            try {
              const res = await decryptData(cloudPayload.cipher, cloudPayload.iv, masterKey);
              vaultColumns = res.columns || vaultColumns;
              vaultRows = res.rows || [];
              renderGrid();
            } catch(e) {
              console.error("Sync error", e);
            }
          }
        } else {
          cloudPayload = null;
        }
      });
    }

    window.signIn = async () => {
      const e = document.getElementById("uEmail").value.trim();
      const p = document.getElementById("uPass").value.trim();
      try {
        await signInWithEmailAndPassword(auth, e, p);
      } catch(err) { alert(err.message); }
    };

    window.unlockSheet = async () => {
      const pass = document.getElementById("masterKey").value.trim();
      if (!pass) return alert("Master password daalein!");

      try {
        let salt;
        if (cloudPayload && Array.isArray(cloudPayload.salt) && cloudPayload.salt.length === 16) {
          salt = new Uint8Array(cloudPayload.salt);
        } else {
          salt = crypto.getRandomValues(new Uint8Array(16));
        }

        const derived = await deriveKey(pass, salt);

        if (cloudPayload && cloudPayload.cipher) {
          try {
            const res = await decryptData(cloudPayload.cipher, cloudPayload.iv, derived);
            vaultColumns = res.columns || vaultColumns;
            vaultRows = res.rows || [];
          } catch(err) {
            alert("Galat Master Key!");
            return;
          }
        } else {
          vaultRows = [];
        }

        masterKey = derived;
        document.getElementById("masterBox").classList.add("hidden");
        document.getElementById("gridBox").classList.remove("hidden");
        document.getElementById("masterKey").value = "";
        renderGrid();
      } catch(err) {
        alert("Unlock failed: " + err.message);
      }
    };

    // EXCEL GRID LOGIC
    window.renderGrid = () => {
      const thead = document.getElementById("gridHead");
      const tbody = document.getElementById("gridBody");
      const filter = (document.getElementById("searchBar").value || "").toLowerCase().trim();

      // Render Headers
      let hHtml = `<tr><th style="width:50px; text-align:center;">#</th>`;
      vaultColumns.forEach((col, idx) => {
        hHtml += `
          <th>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span contenteditable="true" onblur="renameColumn(${idx}, this.innerText)">${escapeHtml(col)}</span>
              ${idx > 1 ? `<span class="quick-tag" onclick="removeColumn(${idx})">✕</span>` : ''}
            </div>
          </th>`;
      });
      hHtml += `<th style="width:80px; text-align:center;">Action</th></tr>`;
      thead.innerHTML = hHtml;

      // Filter Rows
      const filtered = vaultRows.map((r, i) => ({ ...r, originalIndex: i })).filter(row => {
        if (!filter) return true;
        return (row.cells || []).some(c => (c.val || "").toLowerCase().includes(filter));
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${vaultColumns.length + 2}" style="text-align:center; padding:20px; color:var(--muted);">Koi record nahi mila. Niche "+ Add Row" karein.</td></tr>`;
        return;
      }

      // Render Rows
      let bHtml = "";
      filtered.forEach((row, rowIdx) => {
        bHtml += `<tr><td style="text-align:center; color:var(--muted);">${rowIdx + 1}</td>`;
        vaultColumns.forEach((_, colIdx) => {
          const cell = (row.cells && row.cells[colIdx]) ? row.cells[colIdx] : { val: "", secret: false };
          const isSecret = cell.secret && !cell.revealed;
          bHtml += `
            <td>
              <div style="display:flex; align-items:center; gap:6px;">
                <input type="${isSecret ? 'password' : 'text'}" 
                  class="cell-input ${isSecret ? 'cell-masked' : ''}" 
                  value="${escapeQuotes(cell.val || '')}" 
                  onchange="updateCell(${row.originalIndex}, ${colIdx}, this.value)" 
                  placeholder="Empty..." />
                <span class="quick-tag" onclick="toggleCellSecret(${row.originalIndex}, ${colIdx})" title="Toggle Mask">${cell.secret ? '🔒' : '🔓'}</span>
                <span class="quick-tag" onclick="copyValue('${escapeQuotes(cell.val || '')}')" title="Copy">📋</span>
              </div>
            </td>`;
        });
        bHtml += `
          <td style="text-align:center;">
            <button class="danger sm" onclick="deleteRow(${row.originalIndex})">Delete</button>
          </td>
        </tr>`;
      });

      tbody.innerHTML = bHtml;
    };

    window.addRow = async () => {
      const newCells = vaultColumns.map((col, idx) => ({
        val: "",
        secret: (idx === 2) // Default 3rd column secret
      }));
      vaultRows.unshift({ id: Date.now(), cells: newCells });
      await syncCloud();
      renderGrid();
    };

    window.addColumn = async () => {
      const name = prompt("Naye Cell/Column ka naam likhein:", "Extra Detail");
      if (!name) return;
      vaultColumns.push(name.trim());
      vaultRows.forEach(row => {
        if (!row.cells) row.cells = [];
        row.cells.push({ val: "", secret: false });
      });
      await syncCloud();
      renderGrid();
    };

    window.renameColumn = async (colIdx, newName) => {
      if (!newName.trim()) return;
      vaultColumns[colIdx] = newName.trim();
      await syncCloud();
    };

    window.removeColumn = async (colIdx) => {
      if (confirm(`Column "${vaultColumns[colIdx]}" delete karna hai? Iska saara data hatt jayega.`)) {
        vaultColumns.splice(colIdx, 1);
        vaultRows.forEach(row => {
          if (row.cells) row.cells.splice(colIdx, 1);
        });
        await syncCloud();
        renderGrid();
      }
    };

    window.updateCell = async (rIdx, cIdx, val) => {
      if (!vaultRows[rIdx].cells) vaultRows[rIdx].cells = [];
      if (!vaultRows[rIdx].cells[cIdx]) vaultRows[rIdx].cells[cIdx] = { val: "", secret: false };
      vaultRows[rIdx].cells[cIdx].val = val;
      await syncCloud();
    };

    window.toggleCellSecret = async (rIdx, cIdx) => {
      const c = vaultRows[rIdx].cells[cIdx];
      c.secret = !c.secret;
      await syncCloud();
      renderGrid();
    };

    window.deleteRow = async (rIdx) => {
      if (confirm("Row delete karni hai?")) {
        vaultRows.splice(rIdx, 1);
        await syncCloud();
        renderGrid();
      }
    };

    async function syncCloud() {
      if (!currentUser || !masterKey) return;
      const dataToSave = { columns: vaultColumns, rows: vaultRows };
      const encrypted = await encryptData(dataToSave, masterKey);

      let saltArr = (cloudPayload && cloudPayload.salt) 
        ? cloudPayload.salt 
        : Array.from(crypto.getRandomValues(new Uint8Array(16)));

      await setDoc(doc(db, "vaults", currentUser.uid), {
        iv: encrypted.iv,
        cipher: encrypted.cipher,
        salt: saltArr,
        lastUpdated: new Date().toISOString()
      });
    }

    window.copyValue = (t) => {
      if (!t) return;
      navigator.clipboard.writeText(t).then(() => alert("Copied: " + t));
    };

    window.lockSheet = () => {
      masterKey = null;
      vaultRows = [];
      document.getElementById("gridBox").classList.add("hidden");
      document.getElementById("masterBox").classList.remove("hidden");
    };

    window.logOut = async () => {
      masterKey = null;
      vaultRows = [];
      await signOut(auth);
    };

    function escapeHtml(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function escapeQuotes(s) { return (s || "").replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  </script>
</head>
<body>

<div class="container">

  <!-- STEP 1: AUTHENTICATION -->
  <div id="authBox" class="card" style="max-width:480px; margin: 40px auto;">
    <h1>🛡️ OmniVault Access</h1>
    <p>Apne authorized email credentials se sign-in karein.</p>
    <label>Email</label>
    <input type="email" id="uEmail" placeholder="your-email@gmail.com" />
    <label>Password</label>
    <input type="password" id="uPass" placeholder="••••••••" />
    <button onclick="signIn()">Sign In</button>
  </div>

  <!-- STEP 2: MASTER DECRYPTION -->
  <div id="masterBox" class="card hidden" style="max-width:480px; margin: 40px auto;">
    <h1>🔐 Unlock Dynamic Matrix</h1>
    <p>Apna Master Passphrase enter karein jo is sheet ko decrypt karega.</p>
    <label>Master Passphrase</label>
    <input type="password" id="masterKey" placeholder="Master Key..." />
    <div class="btn-row">
      <button onclick="unlockSheet()">Unlock & Sync</button>
      <button class="secondary" onclick="logOut()">Sign Out</button>
    </div>
  </div>

  <!-- STEP 3: EXCEL SHEET GRID INTERFACE -->
  <div id="gridBox" class="hidden">
    
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px;">
      <div class="btn-row">
        <span class="status-badge">● EXCEL E2EE MATRIX</span>
        <button class="sm" onclick="addRow()">+ Add New Row</button>
        <button class="sm secondary" onclick="addColumn()">+ Add Custom Column</button>
      </div>
      <div class="btn-row">
        <button class="sm secondary" onclick="lockSheet()">Lock</button>
        <button class="sm danger" onclick="logOut()">Logout</button>
      </div>
    </div>

    <!-- Live Universal Search -->
    <div class="card" style="padding: 10px 14px; margin-bottom: 8px;">
      <input type="text" id="searchBar" placeholder="🔍 Search any cell (Item, card, policy, CVV, pin, notes)..." oninput="renderGrid()" style="margin-bottom:0;" />
    </div>

    <!-- Dynamic Excel Table -->
    <div class="sheet-wrapper">
      <table class="excel-table">
        <thead id="gridHead"></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

  </div>

</div>

</body>
</html>
