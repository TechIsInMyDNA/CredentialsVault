<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>OmniVault</title>
  
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root {
      --bg: #0b1120;
      --surface: #131d31;
      --surface-sub: #1b2742;
      --border: #243556;
      --primary: #38bdf8;
      --primary-dim: rgba(56, 189, 248, 0.12);
      --accent: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --folder-color: #f59e0b;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(85px + var(--safe-bottom)); user-select: none; }

    /* TOP BAR */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 17, 32, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .brand-title { font-size: 1.15rem; font-weight: 800; color: var(--primary); letter-spacing: 0.5px; }
    .status-dot { font-size: 0.75rem; color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 5px; }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
    }
    .search-box input {
      width: 100%;
      padding: 10px 8px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
    }

    /* PERSON CHIPS */
    .person-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px 4px;
      scrollbar-width: none;
    }
    .person-tabs::-webkit-scrollbar { display: none; }
    .tab-chip {
      white-space: nowrap;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-chip.active {
      background: var(--primary);
      color: #04101e;
      border-color: var(--primary);
      font-weight: 700;
    }

    /* MAIN CONTAINER */
    .main-content { padding: 12px 16px; max-width: 720px; margin: 0 auto; }

    /* FOLDER ACCORDION */
    .folder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .folder-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: rgba(255,255,255,0.01);
    }
    .folder-title-box { display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; }
    .folder-icon { font-size: 1.1rem; }
    .folder-name { font-size: 0.92rem; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .folder-count { font-size: 0.72rem; background: var(--surface-sub); padding: 2px 7px; border-radius: 10px; color: var(--muted); }

    .folder-actions { display: flex; align-items: center; gap: 6px; margin-left: 8px; }

    .folder-items-container {
      padding: 0 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    /* ITEM CARD */
    .item-card {
      background: var(--surface-sub);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .item-name { font-size: 0.95rem; font-weight: 700; color: var(--primary); }

    .cells-list { display: flex; flex-direction: column; gap: 6px; }
    .cell-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.25);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .cell-key { color: var(--muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .cell-val-box { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .btn-action-tag {
      font-size: 0.75rem;
      padding: 4px 8px;
      background: var(--surface);
      border-radius: 6px;
      color: var(--primary);
      cursor: pointer;
      border: 1px solid var(--border);
    }

    /* FAB BUTTON */
    .fab-btn {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: var(--primary);
      color: #04101e;
      border: none;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 90;
      transition: transform 0.15s;
    }
    .fab-btn:active { transform: scale(0.92); }

    /* MODAL BOTTOM SHEET */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(24px + var(--safe-bottom));
      max-height: 88vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }
    .sheet-title { font-size: 1.1rem; font-weight: 800; color: #fff; margin-bottom: 14px; }
    
    label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; display: block; }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.92rem;
      margin-bottom: 12px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn-row { display: flex; gap: 8px; }
    button.btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #04101e; }
    .btn-secondary { background: var(--surface-sub); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    .field-pair {
      display: grid;
      grid-template-columns: 1fr 1.3fr auto;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    .field-pair input { margin-bottom: 0; }

    .hidden { display: none !important; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPc7uJ3vhGJonnLmtySIgbcEdPCmuZcXg",
      authDomain: "credentials-vault-d867d.firebaseapp.com",
      projectId: "credentials-vault-d867d",
      storageBucket: "credentials-vault-d867d.firebasestorage.app",
      messagingSenderId: "91849339799",
      appId: "1:91849339799:web:fd75a7cc39930b6108cad2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let cloudPayload = null;
    let masterCryptoKey = null;
    let vaultData = []; 
    let activePersonIdx = 0;
    let openFolders = {};
    let idleTimer = null;

    // --- CRYPTO (AES-GCM 256) ---
    async function deriveKey(pass, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(pass), { name: "PBKDF2" }, false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(data, key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(data)));
      return { iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) };
    }

    async function decryptPayload(cipherArr, ivArr, key) {
      const iv = new Uint8Array(ivArr);
      const cipher = new Uint8Array(cipherArr);
      const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
      return JSON.parse(new TextDecoder().decode(dec));
    }

    // --- IDLE & BACKGROUND AUTO-LOCK OPTIMIZATION ---
    function resetIdleTimer() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (masterCryptoKey) window.lockVault();
      }, 5 * 60 * 1000); // 5 minutes inactivity
    }
    ['touchstart', 'mousedown', 'keydown', 'scroll'].forEach(e => window.addEventListener(e, resetIdleTimer));
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && masterCryptoKey) {
        window.lockVault();
      }
    });

    // --- AUTH OBSERVER ---
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("screenAuth").classList.add("hidden");
        document.getElementById("screenMaster").classList.remove("hidden");
        listenCloud(user.uid);
      } else {
        document.getElementById("screenAuth").classList.remove("hidden");
        document.getElementById("screenMaster").classList.add("hidden");
        document.getElementById("screenVault").classList.add("hidden");
      }
    });

    function listenCloud(uid) {
      const ref = doc(db, "vaults", uid);
      onSnapshot(ref, async (snap) => {
        if (snap.exists()) {
          cloudPayload = snap.data();
          if (masterCryptoKey) {
            try {
              vaultData = await decryptPayload(cloudPayload.cipher, cloudPayload.iv, masterCryptoKey);
              renderApp();
            } catch(e) { console.error("Sync decrypt failed", e); }
          }
        }
      });
    }

    window.doLogin = async () => {
      const e = document.getElementById("authEmail").value.trim();
      const p = document.getElementById("authPass").value.trim();
      try { await signInWithEmailAndPassword(auth, e, p); } 
      catch (err) { alert(err.message); }
    };

    window.unlockVault = async () => {
      const pass = document.getElementById("masterInput").value.trim();
      if (!pass) return alert("Master key daalein!");

      try {
        let salt;
        if (cloudPayload && Array.isArray(cloudPayload.salt) && cloudPayload.salt.length === 16) {
          salt = new Uint8Array(cloudPayload.salt);
        } else {
          salt = crypto.getRandomValues(new Uint8Array(16));
        }

        const derived = await deriveKey(pass, salt);

        if (cloudPayload && cloudPayload.cipher) {
          try {
            vaultData = await decryptPayload(cloudPayload.cipher, cloudPayload.iv, derived);
          } catch(e) {
            alert("Galat Master Key!");
            return;
          }
        } else {
          vaultData = [
            {
              id: Date.now(),
              name: "SHUBHAM AGRAWAL",
              folders: [
                { id: 1, name: "SAVING ACCOUNTS", items: [] },
                { id: 2, name: "ALL CARDS", items: [] },
                { id: 3, name: "INSURANCE", items: [] }
              ]
            }
          ];
        }

        masterCryptoKey = derived;
        document.getElementById("screenMaster").classList.add("hidden");
        document.getElementById("screenVault").classList.remove("hidden");
        document.getElementById("masterInput").value = "";
        resetIdleTimer();
        renderApp();
      } catch(e) { alert("Unlock error: " + e.message); }
    };

    // --- RENDER APP ---
    window.renderApp = () => {
      const tabsBox = document.getElementById("personTabs");
      const contentBox = document.getElementById("folderList");
      const query = (document.getElementById("searchBar").value || "").trim().toLowerCase();

      // Person Chips
      let tabsHtml = "";
      vaultData.forEach((p, idx) => {
        tabsHtml += `
          <div class="tab-chip ${idx === activePersonIdx ? 'active' : ''}" onclick="selectPerson(${idx})">
            <span>👤 ${escapeHtml(p.name)}</span>
            <span style="opacity:0.6; font-size:0.7rem;" onclick="event.stopPropagation(); managePerson(${idx})">⚙</span>
          </div>`;
      });
      tabsHtml += `<div class="tab-chip" onclick="promptNewPerson()">+ Add Person</div>`;
      tabsBox.innerHTML = tabsHtml;

      if (!vaultData[activePersonIdx]) activePersonIdx = 0;
      const curPerson = vaultData[activePersonIdx];
      if (!curPerson) {
        contentBox.innerHTML = `<p style="text-align:center; padding:30px; color:var(--muted);">Koi Person nahi hai.</p>`;
        return;
      }

      // Folders
      let fHtml = "";
      (curPerson.folders || []).forEach((folder, fIdx) => {
        const isOpen = openFolders[`${activePersonIdx}_${fIdx}`] || query.length > 0;

        const filteredItems = (folder.items || []).filter(item => {
          if (!query) return true;
          if (item.title.toLowerCase().includes(query)) return true;
          if (item.notes && item.notes.toLowerCase().includes(query)) return true;
          return (item.fields || []).some(f => f.key.toLowerCase().includes(query) || f.val.toLowerCase().includes(query));
        });

        if (query && filteredItems.length === 0) return;

        let itemsHtml = "";
        filteredItems.forEach((item) => {
          const realItemIdx = folder.items.findIndex(i => i.id === item.id);
          let cellsHtml = "";
          (item.fields || []).forEach((f, cIdx) => {
            const cid = `c_${item.id}_${cIdx}`;
            const isHidden = f.isSecret;
            cellsHtml += `
              <div class="cell-row">
                <span class="cell-key">${escapeHtml(f.key)}</span>
                <div class="cell-val-box">
                  <span id="${cid}" style="font-family:${isHidden ? 'monospace' : 'inherit'};">${isHidden ? '••••••••' : escapeHtml(f.val)}</span>
                  ${isHidden ? `<span class="btn-action-tag" onclick="toggleSecret('${cid}', '${escapeQuotes(f.val)}')">Show</span>` : ''}
                  <span class="btn-action-tag" onclick="copyVal('${escapeQuotes(f.val)}')">Copy</span>
                </div>
              </div>
            `;
          });

          itemsHtml += `
            <div class="item-card">
              <div class="item-header">
                <span class="item-name">${escapeHtml(item.title)}</span>
                <div style="display:flex; gap:6px;">
                  <span class="btn-action-tag" onclick="openEditModal(${fIdx}, ${realItemIdx})">Edit</span>
                  <span class="btn-action-tag" style="color:var(--danger);" onclick="deleteItem(${fIdx}, ${realItemIdx})">Delete</span>
                </div>
              </div>
              <div class="cells-list">${cellsHtml}</div>
              ${item.notes ? `<div style="font-size:0.75rem; color:var(--muted); margin-top:8px;">${escapeHtml(item.notes)}</div>` : ''}
            </div>
          `;
        });

        fHtml += `
          <div class="folder-card">
            <div class="folder-header" onclick="toggleFolder(${fIdx})">
              <div class="folder-title-box">
                <span class="folder-icon">${isOpen ? '📂' : '📁'}</span>
                <span class="folder-name">${escapeHtml(folder.name)}</span>
                <span class="folder-count">${filteredItems.length}</span>
              </div>
              <div class="folder-actions" onclick="event.stopPropagation()">
                <span class="btn-action-tag" onclick="renameFolder(${fIdx})" title="Rename Folder">✏</span>
                <span class="btn-action-tag" style="color:var(--danger);" onclick="deleteFolder(${fIdx})" title="Delete Folder">🗑</span>
                <span style="font-size:0.75rem; color:var(--muted); margin-left:4px;" onclick="toggleFolder(${fIdx})">${isOpen ? '▲' : '▼'}</span>
              </div>
            </div>
            ${isOpen ? `
              <div class="folder-items-container">
                ${itemsHtml || '<p style="font-size:0.8rem; color:var(--muted); padding:10px 0;">Folder khali hai.</p>'}
                <button class="btn btn-secondary" style="font-size:0.78rem; padding:6px; margin-top:6px;" onclick="openAddModal(${fIdx})">+ Add Record in ${escapeHtml(folder.name)}</button>
              </div>
            ` : ''}
          </div>
        `;
      });

      contentBox.innerHTML = fHtml || `<p style="text-align:center; padding:30px; color:var(--muted);">Koi record match nahi hua.</p>`;
    };

    window.selectPerson = (idx) => { activePersonIdx = idx; renderApp(); };
    window.toggleFolder = (fIdx) => {
      const key = `${activePersonIdx}_${fIdx}`;
      openFolders[key] = !openFolders[key];
      renderApp();
    };

    // --- FOLDER EDIT / DELETE OPERATIONS ---
    window.renameFolder = async (fIdx) => {
      const folder = vaultData[activePersonIdx].folders[fIdx];
      const newName = prompt("Folder ka naya naam:", folder.name);
      if (!newName || !newName.trim() || newName.trim().toUpperCase() === folder.name) return;
      folder.name = newName.trim().toUpperCase();
      await syncCloud();
      renderApp();
    };

    window.deleteFolder = async (fIdx) => {
      const folder = vaultData[activePersonIdx].folders[fIdx];
      if (confirm(`Kya aap "${folder.name}" aur iske saare records delete karna chahte hain?`)) {
        vaultData[activePersonIdx].folders.splice(fIdx, 1);
        await syncCloud();
        renderApp();
      }
    };

    // --- PERSON EDIT / DELETE OPERATIONS ---
    window.managePerson = async (pIdx) => {
      const p = vaultData[pIdx];
      const choice = prompt(`1: Rename "${p.name}"\n2: Delete "${p.name}"\nChoice daalein (1 ya 2):`);
      if (choice === "1") {
        const newName = prompt("Naya naam:", p.name);
        if (newName && newName.trim()) {
          p.name = newName.trim().toUpperCase();
          await syncCloud();
          renderApp();
        }
      } else if (choice === "2") {
        if (confirm(`Confirm: Delete person "${p.name}" and all their folders?`)) {
          vaultData.splice(pIdx, 1);
          if (activePersonIdx >= vaultData.length) activePersonIdx = Math.max(0, vaultData.length - 1);
          await syncCloud();
          renderApp();
        }
      }
    };

    window.promptNewPerson = async () => {
      const name = prompt("Naye Person ka naam:");
      if (!name || !name.trim()) return;
      vaultData.push({ id: Date.now(), name: name.trim().toUpperCase(), folders: [] });
      activePersonIdx = vaultData.length - 1;
      await syncCloud();
      renderApp();
    };

    window.promptNewFolder = async () => {
      const p = vaultData[activePersonIdx];
      const name = prompt(`${p.name} ke liye naye Folder ka naam:`);
      if (!name || !name.trim()) return;
      p.folders.push({ id: Date.now(), name: name.trim().toUpperCase(), items: [] });
      await syncCloud();
      renderApp();
    };

    // --- ITEM RECORD MODAL ---
    let curFIdx = null;
    let curIIdx = null;

    window.openAddModal = (fIdx) => {
      curFIdx = fIdx;
      curIIdx = null;
      document.getElementById("modalTitle").textContent = "Add Record Details";
      document.getElementById("recTitle").value = "";
      document.getElementById("recNotes").value = "";
      document.getElementById("dynamicFieldsBox").innerHTML = "";

      window.addFieldRow("Account / ID", "");
      window.addFieldRow("Password / PIN", "", true);

      document.getElementById("modalSheet").classList.remove("hidden");
    };

    window.openEditModal = (fIdx, iIdx) => {
      curFIdx = fIdx;
      curIIdx = iIdx;
      const itm = vaultData[activePersonIdx].folders[fIdx].items[iIdx];

      document.getElementById("modalTitle").textContent = "Edit Record";
      document.getElementById("recTitle").value = itm.title || "";
      document.getElementById("recNotes").value = itm.notes || "";
      
      const box = document.getElementById("dynamicFieldsBox");
      box.innerHTML = "";
      (itm.fields || []).forEach(f => window.addFieldRow(f.key, f.val, f.isSecret));

      document.getElementById("modalSheet").classList.remove("hidden");
    };

    window.closeModal = () => { document.getElementById("modalSheet").classList.add("hidden"); };

    window.addFieldRow = (k = "", v = "", isSec = false) => {
      const box = document.getElementById("dynamicFieldsBox");
      const d = document.createElement("div");
      d.className = "field-pair";
      d.innerHTML = `
        <input type="text" placeholder="Key (CVV, IFSC)" value="${escapeQuotes(k)}" class="f-key" />
        <input type="${isSec ? 'password' : 'text'}" placeholder="Value" value="${escapeQuotes(v)}" class="f-val" />
        <button type="button" class="btn btn-danger" style="padding:6px 10px;" onclick="this.parentElement.remove()">✕</button>
      `;
      box.appendChild(d);
    };

    window.saveModalRecord = async () => {
      const title = document.getElementById("recTitle").value.trim();
      const notes = document.getElementById("recNotes").value.trim();
      if (!title) return alert("Title zaroori hai!");

      const fieldPairs = [];
      const keys = document.querySelectorAll(".f-key");
      const vals = document.querySelectorAll(".f-val");
      for (let i = 0; i < keys.length; i++) {
        if (keys[i].value || vals[i].value) {
          fieldPairs.push({ key: keys[i].value || "Detail", val: vals[i].value, isSecret: vals[i].type === 'password' });
        }
      }

      const itemObj = {
        id: curIIdx !== null ? vaultData[activePersonIdx].folders[curFIdx].items[curIIdx].id : Date.now(),
        title,
        notes,
        fields: fieldPairs
      };

      if (curIIdx !== null) {
        vaultData[activePersonIdx].folders[curFIdx].items[curIIdx] = itemObj;
      } else {
        vaultData[activePersonIdx].folders[curFIdx].items.unshift(itemObj);
      }

      await syncCloud();
      window.closeModal();
      renderApp();
    };

    window.deleteItem = async (fIdx, iIdx) => {
      if (confirm("Delete karna hai?")) {
        vaultData[activePersonIdx].folders[fIdx].items.splice(iIdx, 1);
        await syncCloud();
        renderApp();
      }
    };

    async function syncCloud() {
      if (!currentUser || !masterCryptoKey) return;
      const encrypted = await encryptPayload(vaultData, masterCryptoKey);
      let saltArr = (cloudPayload && cloudPayload.salt) ? cloudPayload.salt : Array.from(crypto.getRandomValues(new Uint8Array(16)));

      await setDoc(doc(db, "vaults", currentUser.uid), {
        iv: encrypted.iv,
        cipher: encrypted.cipher,
        salt: saltArr,
        lastModified: new Date().toISOString()
      });
    }

    // --- BACKUP EXPORT / IMPORT OPTIMIZATION ---
    window.exportEncryptedBackup = () => {
      if (!cloudPayload) return alert("No data to export!");
      const blob = new Blob([JSON.stringify(cloudPayload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `OmniVault_Encrypted_Backup_${Date.now()}.json`;
      a.click();
    };

    window.importEncryptedBackup = () => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".json";
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        try {
          const parsed = JSON.parse(text);
          if (parsed.cipher && parsed.iv && parsed.salt) {
            if (confirm("Restore this encrypted backup? Current cloud data will be overwritten.")) {
              await setDoc(doc(db, "vaults", currentUser.uid), parsed);
              alert("Backup Restored! Refresh page.");
              location.reload();
            }
          } else {
            alert("Invalid backup file format!");
          }
        } catch (err) { alert("Corrupt JSON file!"); }
      };
      input.click();
    };

    window.toggleSecret = (id, val) => {
      const el = document.getElementById(id);
      el.textContent = el.textContent === '••••••••' ? val : '••••••••';
    };

    window.copyVal = (v) => {
      if (!v) return;
      navigator.clipboard.writeText(v).then(() => alert("Copied: " + v));
    };

    window.lockVault = () => {
      masterCryptoKey = null;
      document.getElementById("screenVault").classList.add("hidden");
      document.getElementById("screenMaster").classList.remove("hidden");
    };

    function escapeHtml(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function escapeQuotes(s) { return (s || "").replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  </script>
</head>
<body>

  <!-- 1. LOGIN -->
  <div id="screenAuth" style="padding:24px; max-width:400px; margin: 50px auto;">
    <h2 style="color:var(--primary); margin-bottom:12px;">🛡️ OmniVault</h2>
    <label>Email</label>
    <input type="email" id="authEmail" placeholder="your-email@gmail.com" />
    <label>Password</label>
    <input type="password" id="authPass" placeholder="••••••••" />
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Sign In</button>
  </div>

  <!-- 2. MASTER PASSPHRASE -->
  <div id="screenMaster" class="hidden" style="padding:24px; max-width:400px; margin: 50px auto;">
    <h2 style="color:var(--primary); margin-bottom:12px;">🔐 Unlock Vault</h2>
    <p style="font-size:0.85rem; color:var(--muted); margin-bottom:12px;">Data zero-knowledge encrypted hai.</p>
    <label>Master Passphrase</label>
    <input type="password" id="masterInput" placeholder="Master Key..." />
    <button class="btn btn-primary" style="width:100%;" onclick="unlockVault()">Decrypt</button>
  </div>

  <!-- 3. MOBILE VAULT -->
  <div id="screenVault" class="hidden">
    
    <!-- Top Sticky Bar -->
    <div class="top-bar">
      <div class="brand-row">
        <span class="brand-title">OmniVault</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <span class="btn-action-tag" onclick="exportEncryptedBackup()" title="Download Backup">💾</span>
          <span class="btn-action-tag" onclick="importEncryptedBackup()" title="Restore Backup">📥</span>
          <span class="btn-action-tag" onclick="lockVault()">Lock</span>
        </div>
      </div>
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchBar" placeholder="Quick search cards, pins, banks..." oninput="renderApp()" />
      </div>
    </div>

    <!-- Person Horizontal Tabs -->
    <div class="person-tabs" id="personTabs"></div>

    <!-- Folder List Accordion -->
    <div class="main-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin: 8px 0 12px;">
        <span style="font-size:0.75rem; color:var(--muted); font-weight:bold; text-transform:uppercase;">Folders & Accounts</span>
        <span class="btn-action-tag" onclick="promptNewFolder()">+ New Folder</span>
      </div>
      <div id="folderList"></div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-btn" onclick="promptNewFolder()" title="Add Category/Folder">+</button>

    <!-- Slide-Up Modal Bottom Sheet -->
    <div id="modalSheet" class="modal-overlay hidden">
      <div class="modal-sheet">
        <div class="sheet-title" id="modalTitle">Record Details</div>

        <label>Title (e.g. HDFC Millennia, SBI Saving, LIC Policy)</label>
        <input type="text" id="recTitle" placeholder="Title..." />

        <label>Dynamic Fields (Label & Value)</label>
        <div id="dynamicFieldsBox"></div>

        <div class="btn-row" style="margin-bottom:12px;">
          <button type="button" class="btn btn-secondary" style="font-size:0.8rem;" onclick="addFieldRow('', '')">+ Add Text</button>
          <button type="button" class="btn btn-secondary" style="font-size:0.8rem;" onclick="addFieldRow('', '', true)">+ Add Password</button>
        </div>

        <label>Notes</label>
        <textarea id="recNotes" rows="2" placeholder="Renewal, nominee, branch..."></textarea>

        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveModalRecord()">Save</button>
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
