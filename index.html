<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OmniVault - Multi-Level Dynamic Vault</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --card-inner: #0b1220;
      --border: #202d44;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 760px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.25rem; color: var(--primary); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    h2 { font-size: 1.1rem; color: #e2e8f0; margin-bottom: 14px; }
    p { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; line-height: 1.4; }

    label { font-size: 0.75rem; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: var(--primary);
      color: #04101e;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #1e293b; color: #cbd5e1; border: 1px solid var(--border); }
    button.secondary:hover { background: #334155; }
    button.danger { background: var(--danger); color: #fff; }
    button.accent { background: var(--accent); color: #04101e; }
    button.sm { padding: 5px 10px; font-size: 0.78rem; }

    /* Level 1 Group Container */
    .group-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .group-header {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Level 2 Sub-Item Card */
    .subitem-card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .subitem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 6px;
    }
    .subitem-title { font-size: 1rem; font-weight: 700; color: var(--primary); }

    /* Level 3 Dynamic Fields */
    .fields-list { display: flex; flex-direction: column; gap: 6px; }
    .data-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 6px 10px;
      border-radius: 5px;
      background: rgba(255,255,255,0.02);
    }
    .data-key { color: var(--muted); font-weight: 600; }
    .data-val-wrapper { display: flex; align-items: center; gap: 8px; max-width: 65%; word-break: break-all; text-align: right; }
    .action-btn { color: var(--primary); cursor: pointer; font-size: 0.78rem; text-decoration: none; }
    .action-btn:hover { text-decoration: underline; }

    /* Dynamic field input row in modal */
    .field-pair {
      display: grid;
      grid-template-columns: 1fr 1.3fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .field-pair input { margin-bottom: 0; }

    .search-container { position: relative; margin-bottom: 0; }
    .search-container input {
      padding-left: 36px;
      margin-bottom: 0;
      border-radius: 20px;
      background: #080c14;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .status-badge { font-size: 0.75rem; color: var(--success); font-weight: 700; }
    .hidden { display: none !important; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDPc7uJ3vhGJonnLmtySIgbcEdPCmuZcXg",
      authDomain: "credentials-vault-d867d.firebaseapp.com",
      projectId: "credentials-vault-d867d",
      storageBucket: "credentials-vault-d867d.firebasestorage.app",
      messagingSenderId: "91849339799",
      appId: "1:91849339799:web:fd75a7cc39930b6108cad2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let cloudRawPayload = null;
    let masterCryptoKey = null;
    let decryptedRecords = [];
    let editingRecordId = null;

    // Cryptographic Engine
    async function deriveKey(passphrase, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(dataObj, key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(JSON.stringify(dataObj))
      );
      return {
        iv: Array.from(iv),
        cipher: Array.from(new Uint8Array(cipher))
      };
    }

    async function decryptPayload(cipherArray, ivArray, key) {
      const iv = new Uint8Array(ivArray);
      const cipher = new Uint8Array(cipherArray);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        cipher
      );
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("viewAuth").classList.add("hidden");
        document.getElementById("viewMasterKey").classList.remove("hidden");
        listenToFirestore(user.uid);
      } else {
        document.getElementById("viewAuth").classList.remove("hidden");
        document.getElementById("viewMasterKey").classList.add("hidden");
        document.getElementById("viewVault").classList.add("hidden");
      }
    });

    function listenToFirestore(uid) {
      const docRef = doc(db, "vaults", uid);
      onSnapshot(docRef, async (snap) => {
        if (snap.exists()) {
          cloudRawPayload = snap.data();
          if (masterCryptoKey) {
            try {
              decryptedRecords = await decryptPayload(cloudRawPayload.cipher, cloudRawPayload.iv, masterCryptoKey);
              renderVault();
            } catch (err) {
              console.error("Auto-sync decrypt failed", err);
            }
          }
        } else {
          cloudRawPayload = null;
          if (masterCryptoKey) {
            decryptedRecords = [];
            renderVault();
          }
        }
      });
    }

    window.handleLogin = async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        alert("Login Error: " + err.message);
      }
    };

    window.unlockVault = async () => {
      const masterPass = document.getElementById("masterPassInput").value.trim();
      if (!masterPass) return alert("Master Passphrase daalein!");

      try {
        let salt;
        if (cloudRawPayload && cloudRawPayload.salt) {
          salt = new Uint8Array(cloudRawPayload.salt);
        } else {
          salt = crypto.getRandomValues(new Uint8Array(16));
        }

        const derived = await deriveKey(masterPass, salt);

        if (cloudRawPayload && cloudRawPayload.cipher) {
          decryptedRecords = await decryptPayload(cloudRawPayload.cipher, cloudRawPayload.iv, derived);
        } else {
          decryptedRecords = [];
        }

        masterCryptoKey = derived;
        document.getElementById("viewMasterKey").classList.add("hidden");
        document.getElementById("viewVault").classList.remove("hidden");
        document.getElementById("masterPassInput").value = "";
        renderVault();
      } catch (e) {
        alert("Galat Master Key! Decryption fail ho gaya.");
        console.error(e);
      }
    };

    window.addDynamicFieldRow = (k = "", v = "", isSecret = false) => {
      const container = document.getElementById("dynamicFieldsBox");
      const row = document.createElement("div");
      row.className = "field-pair";
      row.innerHTML = `
        <input type="text" placeholder="Field Naam (e.g. Card No, PIN, CVV, Policy No)" value="${escapeQuotes(k)}" class="f-key" />
        <input type="${isSecret ? 'password' : 'text'}" placeholder="Field Value" value="${escapeQuotes(v)}" class="f-val" />
        <button type="button" class="danger sm" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(row);
    };

    window.openAddModal = () => {
      editingRecordId = null;
      document.getElementById("formModalTitle").textContent = "Add Dynamic Entry";
      document.getElementById("recGroup").value = "";
      document.getElementById("recSubTitle").value = "";
      document.getElementById("recNotes").value = "";
      document.getElementById("dynamicFieldsBox").innerHTML = "";
      
      // Default blank field
      window.addDynamicFieldRow("", "");

      document.getElementById("formModal").classList.remove("hidden");
      document.getElementById("formModal").scrollIntoView({ behavior: 'smooth' });
    };

    window.closeFormModal = () => {
      document.getElementById("formModal").classList.add("hidden");
    };

    window.saveRecord = async () => {
      const groupName = document.getElementById("recGroup").value.trim();
      const subTitle = document.getElementById("recSubTitle").value.trim();
      const notes = document.getElementById("recNotes").value.trim();

      if (!groupName || !subTitle) {
        return alert("Level 1 Header aur Level 2 Item Naam dono likhna zaroori hai!");
      }

      const fieldPairs = [];
      const keys = document.querySelectorAll(".f-key");
      const vals = document.querySelectorAll(".f-val");

      for (let i = 0; i < keys.length; i++) {
        const k = keys[i].value.trim();
        const v = vals[i].value.trim();
        if (k || v) {
          fieldPairs.push({
            key: k || "Detail",
            val: v,
            isSecret: vals[i].type === "password"
          });
        }
      }

      if (editingRecordId) {
        const idx = decryptedRecords.findIndex(r => r.id === editingRecordId);
        if (idx !== -1) {
          decryptedRecords[idx] = {
            id: editingRecordId,
            groupName,
            subTitle,
            notes,
            fields: fieldPairs,
            updatedAt: new Date().toISOString()
          };
        }
      } else {
        decryptedRecords.unshift({
          id: Date.now(),
          groupName,
          subTitle,
          notes,
          fields: fieldPairs,
          updatedAt: new Date().toISOString()
        });
      }

      await syncCloud();
      window.closeFormModal();
      renderVault();
    };

    window.editRecord = (id) => {
      const rec = decryptedRecords.find(r => r.id === id);
      if (!rec) return;

      editingRecordId = id;
      document.getElementById("formModalTitle").textContent = "Edit Dynamic Entry";
      document.getElementById("recGroup").value = rec.groupName || "";
      document.getElementById("recSubTitle").value = rec.subTitle || "";
      document.getElementById("recNotes").value = rec.notes || "";

      const box = document.getElementById("dynamicFieldsBox");
      box.innerHTML = "";
      if (rec.fields && rec.fields.length > 0) {
        rec.fields.forEach(f => {
          window.addDynamicFieldRow(f.key, f.val, f.isSecret);
        });
      } else {
        window.addDynamicFieldRow("", "");
      }

      document.getElementById("formModal").classList.remove("hidden");
      document.getElementById("formModal").scrollIntoView({ behavior: 'smooth' });
    };

    window.deleteRecord = async (id) => {
      if (confirm("Kya aap is entry ko permanently delete karna chahte hain?")) {
        decryptedRecords = decryptedRecords.filter(r => r.id !== id);
        await syncCloud();
        renderVault();
      }
    };

    async function syncCloud() {
      if (!currentUser || !masterCryptoKey) return;
      const encrypted = await encryptPayload(decryptedRecords, masterCryptoKey);

      let saltArr = (cloudRawPayload && cloudRawPayload.salt) 
        ? cloudRawPayload.salt 
        : Array.from(crypto.getRandomValues(new Uint8Array(16)));

      await setDoc(doc(db, "vaults", currentUser.uid), {
        iv: encrypted.iv,
        cipher: encrypted.cipher,
        salt: saltArr,
        lastModified: new Date().toISOString()
      });
    }

    // Dynamic Multi-Level Render & Partial Search
    window.renderVault = () => {
      const container = document.getElementById("vaultList");
      const query = (document.getElementById("searchQuery").value || "").trim().toLowerCase();
      container.innerHTML = "";

      const filtered = decryptedRecords.filter(r => {
        if (!query) return true;
        if (r.groupName.toLowerCase().includes(query)) return true;
        if (r.subTitle.toLowerCase().includes(query)) return true;
        if (r.notes && r.notes.toLowerCase().includes(query)) return true;
        return (r.fields || []).some(f => 
          f.key.toLowerCase().includes(query) || f.val.toLowerCase().includes(query)
        );
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--muted);">Koi record nahi mila.</div>`;
        return;
      }

      // Group records by Level 1 Header
      const groups = {};
      filtered.forEach(item => {
        const grp = item.groupName;
        if (!groups[grp]) groups[grp] = [];
        groups[grp].push(item);
      });

      // Render Level 1 > Level 2 > Level 3
      Object.keys(groups).forEach(groupTitle => {
        const groupBox = document.createElement("div");
        groupBox.className = "group-box";

        let subItemsHtml = "";
        groups[groupTitle].forEach(sub => {
          let fieldsHtml = "";
          (sub.fields || []).forEach((f, idx) => {
            const fid = `f_${sub.id}_${idx}`;
            const isHidden = f.isSecret;
            fieldsHtml += `
              <div class="data-row">
                <span class="data-key">${escapeHtml(f.key)}:</span>
                <div class="data-val-wrapper">
                  <span id="${fid}">${isHidden ? '••••••••' : escapeHtml(f.val)}</span>
                  ${isHidden ? `<span class="action-btn" onclick="toggleFieldMask('${fid}', '${escapeQuotes(f.val)}')">Show</span>` : ''}
                  <span class="action-btn" onclick="copyToClipboard('${escapeQuotes(f.val)}')">Copy</span>
                </div>
              </div>
            `;
          });

          subItemsHtml += `
            <div class="subitem-card">
              <div class="subitem-header">
                <span class="subitem-title">${escapeHtml(sub.subTitle)}</span>
                <div class="btn-row">
                  <button class="secondary sm" onclick="editRecord(${sub.id})">Edit</button>
                  <button class="danger sm" onclick="deleteRecord(${sub.id})">Delete</button>
                </div>
              </div>
              <div class="fields-list">
                ${fieldsHtml}
              </div>
              ${sub.notes ? `<div style="font-size:0.8rem; color:var(--muted); margin-top:8px; border-top:1px dashed var(--border); padding-top:6px;"><strong>Notes:</strong> ${escapeHtml(sub.notes)}</div>` : ''}
            </div>
          `;
        });

        groupBox.innerHTML = `
          <div class="group-header">
            <span>📁 ${escapeHtml(groupTitle)}</span>
          </div>
          ${subItemsHtml}
        `;
        container.appendChild(groupBox);
      });
    };

    window.toggleFieldMask = (elementId, actualVal) => {
      const el = document.getElementById(elementId);
      el.textContent = (el.textContent === '••••••••') ? actualVal : '••••••••';
    };

    window.copyToClipboard = (txt) => {
      navigator.clipboard.writeText(txt).then(() => alert("Copied!"));
    };

    window.lockVault = () => {
      masterCryptoKey = null;
      decryptedRecords = [];
      document.getElementById("viewVault").classList.add("hidden");
      document.getElementById("viewMasterKey").classList.remove("hidden");
    };

    window.handleLogout = async () => {
      masterCryptoKey = null;
      decryptedRecords = [];
      await signOut(auth);
    };

    function escapeHtml(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function escapeQuotes(s) { return (s || "").replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
  </script>
</head>
<body>

<div class="app-container">

  <!-- STEP 1: AUTH -->
  <div id="viewAuth" class="card">
    <h1>🛡️ OmniVault Multi-Level</h1>
    <p>Apne authorized email se sign-in karein.</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="your-email@gmail.com" />
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••" />
    <button onclick="handleLogin()">Sign In to Cloud</button>
  </div>

  <!-- STEP 2: MASTER DECRYPTION -->
  <div id="viewMasterKey" class="card hidden">
    <h1>🔐 Master Passphrase</h1>
    <p>Data zero-knowledge encrypted hai. Unlock karne ke liye Master Key enter karein.</p>
    <label>Master Passphrase</label>
    <input type="password" id="masterPassInput" placeholder="Enter Master Key..." />
    <div class="btn-row">
      <button onclick="unlockVault()">Decrypt & Sync</button>
      <button class="secondary" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>

  <!-- STEP 3: MAIN VIEW -->
  <div id="viewVault" class="hidden">
    
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <span class="status-badge">● 3-LEVEL E2EE ACTIVE</span>
      </div>
      <div class="btn-row">
        <button class="sm secondary" onclick="lockVault()">Lock</button>
        <button class="sm danger" onclick="handleLogout()">Logout</button>
      </div>
    </div>

    <!-- Search & New Entry Trigger -->
    <div class="card">
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="search-container" style="flex:1;">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchQuery" placeholder="Search across all headers, items, fields..." oninput="renderVault()" />
        </div>
        <button onclick="openAddModal()" style="white-space:nowrap; height:42px;">+ Add New</button>
      </div>
    </div>

    <!-- DYNAMIC FORM MODAL -->
    <div id="formModal" class="card hidden" style="border: 1px solid var(--primary);">
      <h2 id="formModalTitle">Add Dynamic Entry</h2>
      
      <label>1. Main Header / Folder Naam (Kiska hai?)</label>
      <input type="text" id="recGroup" placeholder="e.g. LIC Policies, HDFC Bank, Medical Store Portals, Personal IDs" />

      <label>2. Item / Sub-Title Naam (Uske andar kya chiz hai?)</label>
      <input type="text" id="recSubTitle" placeholder="e.g. Jeevan Labh Policy, NetBanking, GST Login, Pan Card" />

      <label>3. Fields & Details (Uske andar kya-kya hai?)</label>
      <div id="dynamicFieldsBox"></div>
      
      <div class="btn-row" style="margin-bottom:14px;">
        <button type="button" class="secondary sm" onclick="addDynamicFieldRow('', '')">+ Add Text Field</button>
        <button type="button" class="secondary sm" onclick="addDynamicFieldRow('', '', true)">+ Add Hidden/Secret Field</button>
      </div>

      <label>Notes / Extra Info (Optional)</label>
      <textarea id="recNotes" rows="2" placeholder="Renewal dates, customer care number, extra instructions..."></textarea>

      <div class="btn-row">
        <button onclick="saveRecord()">Save Encrypted</button>
        <button class="secondary" onclick="closeFormModal()">Cancel</button>
      </div>
    </div>

    <!-- RENDER LIST -->
    <div id="vaultList"></div>

  </div>

</div>

</body>
</html>
